services:
  gjemmekontor:
    image: ghcr.io/haavardnk/gjemmekontor:latest
    container_name: gjemmekontor
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      DATA_DIR: /data
      ENABLED_MODULES: ${ENABLED_MODULES:-map,shots,logbook,shopping-list,menu,gear}
      GOOGLE_MY_MAPS_ID: ${GOOGLE_MY_MAPS_ID:?Set GOOGLE_MY_MAPS_ID}
      GOOGLE_PLACES_SERVER_API_KEY: ${GOOGLE_PLACES_SERVER_API_KEY:-}
      GOOGLE_PLACES_UI_KIT_API_KEY: ${GOOGLE_PLACES_UI_KIT_API_KEY:-}
      TRIPADVISOR_TERRA_API_KEY: ${TRIPADVISOR_TERRA_API_KEY:-}
      TRIPADVISOR_TERRA_PHOTOS_ENABLED: ${TRIPADVISOR_TERRA_PHOTOS_ENABLED:-false}
      TRIPADVISOR_CACHE_DAYS: ${TRIPADVISOR_CACHE_DAYS:-30}
      AISSTREAM_API_KEY: ${AISSTREAM_API_KEY:?Set AISSTREAM_API_KEY}
      BRING_EMAIL: ${BRING_EMAIL:?Set BRING_EMAIL}
      BRING_PASSWORD: ${BRING_PASSWORD:?Set BRING_PASSWORD}
      BRING_LIST_UUID: ${BRING_LIST_UUID:?Set BRING_LIST_UUID}
      ORIGIN: ${ORIGIN:?Set ORIGIN}
      BODY_SIZE_LIMIT: 6M
    volumes:
      - /mnt/user/appdata/gjemmekontor:/data
      # Optional operator-provided PMTiles archives:
      # - /mnt/user/media/gjemmekontor/offline:/data/map/offline:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - gjemmekontor
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

networks:
  gjemmekontor:
    name: gjemmekontor
